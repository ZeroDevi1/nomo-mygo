name: MSIX

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/msix/**'
      - 'mygo.json'
      - '.github/workflows/msix.yml'
  push:
    branches:
      - master
    paths:
      - 'desktop/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/msix/**'
      - 'mygo.json'
      - '.github/workflows/msix.yml'

permissions:
  contents: read

jobs:
  build-msix-x64:
    name: Build and validate x64 MSIX
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content -LiteralPath 'desktop\packaging\msix\package-identity.json' -Raw | ConvertFrom-Json
          $mode = if ($identity.state -eq 'partnerCenter') { 'Store' } else { 'Dev' }
          & 'scripts\msix\Build-Msix.ps1' -Mode $mode -Configuration Release

      - name: Upload validated MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nomo-msix-x64-${{ github.sha }}
          path: .artifacts/msix/output/*
          if-no-files-found: error
