name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # 先建 Release（正文取 .github/release-notes/<tag>.md），各平台构建完成后上传资产。资产名沿用 Tauri 时期的命名：
  # 应用内更新（desktop/update_install.go）、Homebrew cask 与下载站按这些文件名查找。
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          if gh release view "$tag" > /dev/null 2>&1; then
            exit 0
          fi
          notes=".github/release-notes/$tag.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/notes.md"
            printf '%s\n' 'Windows:' '- x64-setup.exe: 安装版' '- x64.zip: 免安装版' '' 'macOS:' '- .dmg / .app.tar.gz: arm64' '' \
              'Linux:' '- .deb / .tar.gz: x64' '- checksums.md5: MD5 校验清单' > "$notes"
          fi
          prerelease=()
          if [[ "$tag" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$tag" --verify-tag --title "Nomo $tag" --notes-file "$notes" "${prerelease[@]}"

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # MyGo 不需要 cgo：Windows 版在 Ubuntu 上交叉编译，安装包用 NSIS 生成。
          - name: Windows x64
            runner: ubuntu-24.04
            platform: windows/amd64
          - name: macOS arm64
            runner: macos-latest
            platform: darwin/arm64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # mygo build 用 actool 编译 Icon Composer 图标（mygo.json 的 macos.icon），需要 Xcode 26 及以上。
      - name: Select latest Xcode
        if: startsWith(matrix.platform, 'darwin/')
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install NSIS
        if: matrix.platform == 'windows/amd64'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          set -euo pipefail
          if [[ '${{ matrix.platform }}' == darwin/* ]]; then
            # 含 Quick Look 扩展的 .app 与 .dmg（scripts/build-macos.sh 调用 mygo build 后嵌入扩展并重新签名）。
            MACOS_PLATFORM='${{ matrix.platform }}' bash scripts/build-macos.sh
          else
            go tool mygo build -platform '${{ matrix.platform }}'
          fi

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          version='${{ github.ref_name }}'
          version="${version#v}"
          assets="$RUNNER_TEMP/assets"
          mkdir -p "$assets"
          case '${{ matrix.platform }}' in
            windows/amd64)
              out=target/mygo/windows-amd64
              cp "$out/Nomo Setup $version amd64.exe" "$assets/Nomo_${version}_x64-setup.exe"
              stage="$RUNNER_TEMP/zip/Nomo"
              mkdir -p "$stage"
              find "$out" -mindepth 1 -maxdepth 1 ! -name 'Nomo Setup *.exe' -exec cp -R {} "$stage/" \;
              (cd "$RUNNER_TEMP/zip" && zip -qr "$assets/Nomo_${version}_x64.zip" Nomo)
              ;;
            darwin/arm64)
              out=target/mygo/darwin-arm64
              cp "$out/Nomo $version arm64.dmg" "$assets/Nomo_${version}_aarch64.dmg"
              tar -C "$out" -czf "$assets/Nomo_aarch64.app.tar.gz" Nomo.app
              ;;
            linux/amd64)
              out=target/mygo/linux-amd64
              cp "$out"/*_amd64.deb "$assets/Nomo_${version}_amd64.deb"
              cp "$out"/*-linux-amd64.tar.gz "$assets/"
              ;;
          esac
          ls -l "$assets"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload '${{ github.ref_name }}' "$RUNNER_TEMP"/assets/* --clobber

  checksums:
    name: Publish MD5 checksums
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}

    steps:
      - name: Generate and upload checksums.md5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download '${{ github.ref_name }}' --dir release-assets --clobber
          rm -f release-assets/checksums.md5 checksums.md5

          mapfile -d '' files < <(find release-assets -maxdepth 1 -type f ! -name 'checksums.md5' -print0 | sort -z)
          : > checksums.md5
          for file in "${files[@]}"; do
            md5="$(md5sum "$file" | awk '{print $1}')"
            name="$(basename "$file")"
            printf '%s  %s\n' "$md5" "$name" >> checksums.md5
          done

          gh release upload '${{ github.ref_name }}' checksums.md5 --clobber

  # Cask 与下载站指向上游 nomo-md/nomo 的发布资产，只在上游仓库运行（分支仓库只发布安装包）。
  update-homebrew-cask:
    name: Update Homebrew cask
    runs-on: ubuntu-latest
    needs: checksums
    if: ${{ github.repository == 'nomo-md/nomo' && !contains(github.ref_name, '-') }}
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump Casks/nomo.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="Nomo_${version}_aarch64.dmg"
          gh release download "$TAG" --pattern "$asset" --dir /tmp
          sha256="$(sha256sum "/tmp/$asset" | awk '{print $1}')"
          sed -i -E \
            -e "s/version \"[^\"]+\"/version \"${version}\"/" \
            -e "s/sha256 \"[^\"]+\"/sha256 \"${sha256}\"/" \
            Casks/nomo.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/nomo.rb
          if git diff --staged --quiet; then
            echo 'Homebrew cask already up to date.'
            exit 0
          fi
          git commit -m "chore(homebrew): bump nomo cask to ${version}"
          git push

  sync-pages:
    name: Sync release to download sites
    runs-on: ubuntu-latest
    needs: [build, checksums]
    if: >-
      ${{
        always() &&
        github.repository == 'nomo-md/nomo' &&
        needs.build.result == 'success' &&
        (contains(github.ref_name, '-') || needs.checksums.result == 'success')
      }}
    timeout-minutes: 30

    steps:
      - name: Trigger Pages deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL" || {
            echo 'Missing CLOUDFLARE_PAGES_DEPLOY_HOOK repository secret.' >&2
            exit 1
          }
          curl --fail --show-error --silent --request POST "$DEPLOY_HOOK_URL" >/dev/null

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_ACTIONS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo 'Missing WEBSITE_ACTIONS_TOKEN repository secret.' >&2
            exit 1
          }
          gh api \
            --method POST \
            repos/nomo-md/nomo-md.github.io/actions/workflows/deploy-github-pages.yml/dispatches \
            --field ref=master

      - name: Verify latest stable download mirror
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          base_urls=(
            'https://nomo-md.pages.dev'
            'https://nomo-md.github.io'
          )
          declare -A manifests=()

          for attempt in $(seq 1 150); do
            all_ready=true
            for base_url in "${base_urls[@]}"; do
              if [[ -n "${manifests[$base_url]:-}" ]]; then
                continue
              fi

              if manifest="$(curl --fail --silent --show-error \
                "$base_url/downloads/latest.json?expected=$EXPECTED_TAG&attempt=$attempt")"; then
                actual_tag="$(jq -r '.tag // empty' <<<"$manifest")"
                asset_count="$(jq -r '.assets | length' <<<"$manifest")"
                if [[ "$actual_tag" == "$EXPECTED_TAG" && "$asset_count" == '6' ]]; then
                  manifests[$base_url]="$manifest"
                  continue
                fi
              fi

              all_ready=false
            done

            if [[ "$all_ready" == 'true' && "${#manifests[@]}" == "${#base_urls[@]}" ]]; then
              break
            fi
            sleep 10
          done

          [[ "${#manifests[@]}" == "${#base_urls[@]}" ]] || {
            echo "The download sites did not publish $EXPECTED_TAG within 25 minutes." >&2
            exit 1
          }

          for base_url in "${base_urls[@]}"; do
            mapfile -t asset_urls < <(jq -r '.assets[].url' <<<"${manifests[$base_url]}")
            [[ "${#asset_urls[@]}" == '6' ]]
            for asset_url in "${asset_urls[@]}"; do
              curl --fail --silent --show-error --location --head "$base_url$asset_url" >/dev/null
            done
          done
