<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 页面只在隐藏窗口中使用，WebKit / WebView2 在隐藏窗口里暂停 requestAnimationFrame：依赖它的库
      // （html-to-image 加载图片后、表格列宽调度）会一直等不到回调。改为定时器驱动，约 60 帧每秒。
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
    </script>
    <meta charset="UTF-8" />
    <title>Nomo Render</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
      }
      /* 每个渲染项按内容收缩、纵向排布（间距 4px），位置由 render-entry.ts 逐项测量。 */
      .nomo-item {
        width: max-content;
        padding: 2px 3px;
        margin-bottom: 4px;
        line-height: 1.4;
      }
      .nomo-item .katex-display {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/render/render-entry.ts"></script>
  </body>
</html>
