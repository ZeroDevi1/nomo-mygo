<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Nomo Render</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
      }
      /* 每个渲染项按内容收缩、纵向排布（间距 4px），位置由 render-entry.ts 逐项测量。 */
      .nomo-item {
        width: max-content;
        padding: 2px 3px;
        margin-bottom: 4px;
        line-height: 1.4;
      }
      .nomo-item .katex-display {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/render/render-entry.ts"></script>
  </body>
</html>
